[package]
name = "chat-android"
version = "0.1.0"
edition = "2021"
description = "Chat — Android NativeActivity (Vidya LLM client)"
license = "MIT"
publish = false

# Own workspace root so cargo-apk builds in-tree.
[workspace]

[lib]
name = "chat_android"
path = "src/lib.rs"
# lib-only: cargo-apk panics if this package also has [[bin]] targets
crate-type = ["cdylib", "rlib"]

[dependencies]
chat = { path = ".." }
vidya = { path = "../../vidya" }
# Shared glow + fonts only — do NOT enable wayland/x11 here.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android_logger = "0.14"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "uk.nandi.chat"
apk_name = "chat"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

# Without INTERNET, OpenBao / LLM HTTPS fails with "no address associated with hostname".
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "Chat"
orientations = ["Portrait", "Landscape"]
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
icon = "@mipmap/ic_launcher"
# cargo-apk stores .so compressed; without this, targetSdk 34 install fails
# ("App not installed") because extractNativeLibs defaults to false.
extract_native_libs = true

# Release signing is injected at build time by scripts/build-apk.sh (local + CI).
