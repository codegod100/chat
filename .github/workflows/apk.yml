# Build aarch64 release APK and upload as a GitHub Actions artifact.
#
# Release signing: build-apk.sh generates ~/.android/chat-release.keystore on
# first run; Actions caches it for stable signatures across CI builds.
# Optional override: set CHAT_ANDROID_KEYSTORE_B64 (e.g. from OpenBao) in the job env.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vidya (path dependency)
        run: |
          set -euo pipefail
          git clone --depth 1 https://tangled.org/nandi.uk/vidya ../vidya

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Android release keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/chat-release.keystore
          key: chat-android-release-keystore-v1

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/android-ndk-r29
          key: android-ndk-r29-${{ runner.os }}

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/android-sdk
          key: android-sdk-34-${{ runner.os }}

      - name: Cache cargo-apk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-apk
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-apk-${{ runner.os }}

      - name: Setup Android toolchain
        run: |
          chmod +x scripts/setup-android-ci.sh
          ./scripts/setup-android-ci.sh

      - name: Build release APK
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh --release --target aarch64-linux-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: android/target/release/apk/chat.apk
          if-no-files-found: error
