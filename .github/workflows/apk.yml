# Build aarch64 release APK and upload as a GitHub Actions artifact.
#
# Signing keystore from OpenBao (via OPENBAO_TOKEN repository secret):
#   secret/data/chat → CHAT_ANDROID_KEYSTORE_B64
#   (optional passwords: CHAT_ANDROID_KEYSTORE_PASSWORD, CHAT_ANDROID_KEY_ALIAS, CHAT_ANDROID_KEY_PASSWORD)

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vidya (path dependency)
        run: |
          set -euo pipefail
          git clone --depth 1 https://tangled.org/nandi.uk/vidya ../vidya

      - name: Fetch signing keystore from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
          OPENBAO_EXTRA_PATHS: secret/data/chat
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN repository secret is not set" >&2
            exit 1
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env \
            --keys CHAT_ANDROID_KEYSTORE_B64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/android-ndk-r29
          key: android-ndk-r29-${{ runner.os }}

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/android-sdk
          key: android-sdk-34-${{ runner.os }}

      - name: Cache cargo-apk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-apk
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-apk-${{ runner.os }}

      - name: Setup Android toolchain
        run: |
          chmod +x scripts/setup-android-ci.sh
          ./scripts/setup-android-ci.sh

      - name: Build release APK
        env:
          CHAT_ANDROID_KEYSTORE_B64: ${{ env.CHAT_ANDROID_KEYSTORE_B64 }}
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh --release --target aarch64-linux-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: android/target/release/apk/chat.apk
          if-no-files-found: error
