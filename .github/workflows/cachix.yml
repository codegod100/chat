# Build flake packages on merge to main via nixbuild.net.
#
# OPENBAO_TOKEN unlocks NIXBUILD_TOKEN at runtime (secret/data/ai-api-keys).
# nixbuild.net stores build outputs — no separate Cachix push.

name: Nix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.attr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr: [chat]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN repository secret is not set" >&2
            exit 1
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env --keys NIXBUILD_TOKEN

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: nixbuild/nixbuild-action@v26
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}

      - name: nix build .#${{ matrix.attr }}
        run: nix build ".#${{ matrix.attr }}" -L --print-build-logs
